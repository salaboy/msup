<article class="work-detail">
  <div class="work-gallery">
    <figure class="gallery-main">
      <div class="frame">
$main_image_html
      </div>
    </figure>
$thumbs_html
  </div>

  <div class="work-info">
    <p class="breadcrumb"><a href="${rel}works/">&larr; All work</a></p>
    <h1>$title</h1>
    <p class="work-status status-$status">$status_label</p>
    $price_html
    $description_html
    $details_html
    <p class="work-actions">
      $buy_html
    </p>
    <p class="fine-print">Questions about this piece? Message
      <a href="$instagram_url" rel="noopener">@marylandsupreme</a> on Instagram.</p>
  </div>
</article>
