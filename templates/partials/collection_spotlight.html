<section class="spotlight-section" aria-labelledby="spotlight-heading">
  <h2 id="spotlight-heading" class="section-heading">$kicker</h2>
  <div class="spotlight">
$media_html    <div class="spotlight-text">
      <p class="spotlight-source">$logo_html<span>$source</span></p>
      <p class="spotlight-title">$title</p>
$note_html
      <p class="spotlight-actions">
        <a class="button" href="$url" rel="noopener">$label</a>
      </p>
    </div>
  </div>
</section>
