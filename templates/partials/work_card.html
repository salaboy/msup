<li class="work-card${card_modifier}">
  <a href="${rel}works/$slug/">
    <figure>
      <div class="frame">
        <img src="$img_src"$srcset_attr sizes="(max-width: 700px) 92vw, (max-width: 1100px) 46vw, 32vw"
             alt="$alt"$dim_attrs loading="lazy" decoding="async" referrerpolicy="no-referrer">
      </div>
      <figcaption>
        <span class="work-title">$title</span>
        <span class="work-meta">$meta</span>
      </figcaption>
    </figure>
  </a>
</li>
