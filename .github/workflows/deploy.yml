name: Deploy site

# Covers HUMAN pushes — editing the CSS, the bio, or a curation field in
# data/works.json, including from the GitHub web UI. Build and deploy only; the
# Etsy sync lives in sync-and-publish.yml.
#
# Shares `concurrency: pages` with that workflow so two deploys cannot race.

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "static/**"
      - "scripts/**"
      - "content/**"
      - "data/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Build site
        run: python3 scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
