name: Sync Etsy and publish

# Sync, build and deploy all happen in ONE run, chained by `needs:` rather than
# by a git event. That is deliberate: commits made with GITHUB_TOKEN do not
# trigger further workflow runs, so a "sync commits, push-triggered workflow
# deploys" split would silently never publish a sold-out change.
#
# The same rule means this workflow's own push cannot cause an infinite loop.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview changes without committing or deploying"
        type: boolean
        default: false
      use_api:
        description: "Read the full active inventory from the Etsy API (needed for sold detection)"
        type: boolean
        default: true
      allow_empty:
        description: "Proceed even if the source returns nothing (rare — see README)"
        type: boolean
        default: false
      max_sold:
        description: "Refuse the run if more than this many pieces left Etsy at once"
        type: string
        default: "3"
      archive_images:
        description: "Save a local copy of a piece's photo when it sells"
        type: boolean
        default: false
  # SCHEDULE DISABLED 2026-11-11.
  #
  # The Etsy shop RSS feed returns only ~10 items — a rolling window, not the
  # shop inventory. merge() treated "absent from the feed" as "sold", so every
  # run marked the whole catalogue beyond those 10 as sold: 31 of 41 works were
  # showing sold out on the live site while still for sale on Etsy.
  #
  # Do NOT re-enable until merge() stops inferring sales from feed absence.
  # Until then the sync is manual (workflow_dispatch) and should be run with
  # dry_run first.
  #
  # schedule:
  #   # 06:17 UTC. Off-the-hour on purpose: scheduled runs at :00 queue behind the
  #   # whole platform and get delayed worst.
  #   - cron: "17 6 * * *"

permissions:
  contents: write   # commit data/works.json
  pages: write      # deploy
  id-token: write   # OIDC — deploy-pages fails without this

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync from Etsy
        id: sync
        env:
          # Required for use_api, which is the only source that can tell a sold
          # piece from one the RSS window simply did not include. Without it the
          # sync falls back to RSS and will not mark anything sold.
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.use_api }}" = "true" ]; then ARGS="$ARGS --use-api"; fi
          if [ "${{ inputs.allow_empty }}" = "true" ]; then ARGS="$ARGS --allow-empty"; fi
          if [ "${{ inputs.archive_images }}" = "true" ]; then ARGS="$ARGS --archive-images"; fi
          ARGS="$ARGS --max-sold ${{ inputs.max_sold || '3' }}"
          python3 scripts/sync_etsy.py --check $ARGS | tee sync-report.txt

          {
            echo '## Etsy sync'
            echo '```'
            cat sync-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          rm -f sync-report.txt

      - name: Commit updated works
        if: steps.sync.outputs.changed == 'true' && inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(sync): update works from Etsy"
          git push

      - name: Build site
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync-and-build
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
